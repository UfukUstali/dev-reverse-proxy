# Run beside the operator's existing Traefik and host tailscaled.
services:
  proxy-server:
    build: .
    network_mode: host
    environment:
      LISTEN_ADDR: "${GATEWAY_TAILSCALE_IP:?set the gateway Tailscale IP}:8080"
      CONFIG_DIR: /config
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN:-devrp.liuf.uk}"
      GATEWAY_PUBLIC_IP: "${GATEWAY_PUBLIC_IP:?set the public VPS IP}"
      TRAEFIK_ENTRYPOINT: "${TRAEFIK_ENTRYPOINT:-websecure}"
      TRAEFIK_RESOLVER: "${TRAEFIK_RESOLVER:-hetzner}"
      HETZNER_ZONE: "${HETZNER_ZONE:-}"
      HETZNER_TOKEN: "${HETZNER_TOKEN:-}"
      AUTHCENTER_ROUTING_SUBDOMAIN: "${AUTHCENTER_ROUTING_SUBDOMAIN:-}"
      AUTHCENTER_ROUTING_SECRET: "${AUTHCENTER_ROUTING_SECRET:-}"
      AUTHCENTER_ROUTING_INTERVAL: "${AUTHCENTER_ROUTING_INTERVAL:-30s}"
    volumes:
      - "${TRAEFIK_CONFIG_DIR:?set the existing watched directory}:/config"
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    restart: unless-stopped
